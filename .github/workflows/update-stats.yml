name: Refresh stats cards

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-stats-cards.mjs"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate stats, languages and contributions SVGs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate cards
        run: node scripts/generate-stats-cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "elarfaoui-ala"
          git config user.email "elarfaouiala@gmail.com"
          git add assets/stats.svg assets/languages.svg assets/contributions.svg
          if git diff --cached --quiet; then
            echo "Cards already up to date"
          else
            git commit -m "Refresh stats cards"
            git push
          fi
